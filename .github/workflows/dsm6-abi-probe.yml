name: DSM 6 Bromolow compatibility probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-dsm6-target.mjs'
      - '.github/workflows/dsm6-abi-probe.yml'

permissions:
  contents: read

concurrency:
  group: dsm6-abi-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-check:
    name: Build SPK and check DSM 6 ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out pinned Motrix source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: upstream/Motrix/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: x86_64-unknown-linux-musl

      - name: Confirm Bromolow target and toolchain checksum
        working-directory: upstream/Motrix
        run: node ../../scripts/prepare-dsm6-target.mjs

      - name: Install upstream dependencies
        working-directory: upstream/Motrix
        run: pnpm install --frozen-lockfile
        env:
          MOTRIX_SKIP_ELECTRON_REBUILD: '1'
          MOTRIX_SKIP_ENGINE_FETCH: '1'

      - name: Rebuild SQLite addon with DSM 6 compatible glibc
        shell: bash
        run: |
          set -euo pipefail
          version="24.22.3"
          archive="$RUNNER_TEMP/node-v${version}-linux-x64-glibc-217.tar.xz"
          runtime="$RUNNER_TEMP/node-glibc-217"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 \
            "https://unofficial-builds.nodejs.org/download/release/v${version}/node-v${version}-linux-x64-glibc-217.tar.xz" \
            --output "$archive"
          echo "f15f516e7a451982730cdc6fdb7928205f5b2935deba70e6543705f04847c911  $archive" | sha256sum --check
          mkdir -p "$runtime"
          tar -xJf "$archive" --strip-components=1 -C "$runtime" \
            "node-v${version}-linux-x64-glibc-217/bin" \
            "node-v${version}-linux-x64-glibc-217/include" \
            "node-v${version}-linux-x64-glibc-217/lib"
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$runtime:/node:ro" \
            -w /workspace/upstream/Motrix \
            quay.io/pypa/manylinux2014_x86_64@sha256:8a79ff36ce155d8f242dc8013d73c5e8bbe937defb15de7d7afb342c1ab537f4 \
            bash -lc '
              set -euo pipefail
              export PATH="/node/bin:$PATH"
              export npm_config_prefix=/tmp/npm-global
              export npm_config_nodedir=/node
              export PYTHON="$(find -L /opt/python -path "*/bin/python3" -executable -print -quit)"
              test -x "$PYTHON"
              node --version
              npm install --global node-gyp@12.4.0
              export PATH="/tmp/npm-global/bin:$PATH"
              node-gyp rebuild --release --force_build=1 --directory node_modules/better-sqlite3
              cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
                node_modules/better-sqlite3/prebuilds/linux-x64.node
              node -e "const DB=require(\"better-sqlite3\");const db=new DB(\":memory:\");db.exec(\"create table t(v);insert into t values(42)\");if(db.prepare(\"select v from t\").get().v!==42)process.exit(1);db.close();console.log(\"SQLite native addon smoke passed\")"
            '

      - name: Fetch locked Aria2 engine
        working-directory: upstream/Motrix
        run: pnpm run fetch:engine -- --platform linux --arch x64

      - name: Build Motrix Server and Web UI
        working-directory: upstream/Motrix
        run: pnpm run build:server

      - name: Verify third-party license inventory
        working-directory: upstream/Motrix
        run: pnpm run check:third-party-notices

      - name: Stage the native server package
        working-directory: upstream/Motrix
        run: pnpm run stage:server -- --platform linux --arch x64 --libc gnu --strict

      - name: Download and verify the locked Bromolow SDK
        shell: bash
        run: |
          set -euo pipefail
          cache="upstream/Motrix/node_modules/.cache/synology"
          file="$cache/84c39e280bc4c70dcb7f74dd45dfe6c71e393433dcf55a2428087a879a4d9636-download"
          mkdir -p "$cache"
          if [[ ! -f "$file" ]] || ! echo "84c39e280bc4c70dcb7f74dd45dfe6c71e393433dcf55a2428087a879a4d9636  $file" | sha256sum --check --status; then
            rm -f "$file"
            curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 \
              "https://sourceforge.net/projects/dsgpl/files/Tool%20Chain/DSM%206.2.4%20Tool%20Chains/Intel%20x86%20linux%203.10.105%20%28Bromolow%29/bromolow-gcc493_glibc220_linaro_x86_64-GPL.txz/download" \
              --output "$file"
          fi
          echo "84c39e280bc4c70dcb7f74dd45dfe6c71e393433dcf55a2428087a879a4d9636  $file" | sha256sum --check

      - name: Build SPK and inspect against Bromolow DSM 6.2.4 sysroot
        working-directory: upstream/Motrix
        run: >-
          pnpm run build:synology --
          --arch x64
          --revision 1
          --output-dir release/synology-6.2/project

      - name: Upload diagnostic package and ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Motrix-SPK-DSM6-ABI-probe
          path: |
            upstream/Motrix/release/synology-6.2/*.spk
            upstream/Motrix/release/synology-6.2/*.sha256
            upstream/Motrix/release/synology-6.2/*.abi.json
            upstream/Motrix/release/synology-6.2/project/app/synology-build.json
          if-no-files-found: warn
          retention-days: 7
